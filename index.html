<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Escolas Tech - Scraper Automático</title>
    <!-- Biblioteca gratuita para ler o CSV perfeitamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }
        h1 { color: #0056b3; margin-bottom: 5px;}
        p { color: #555; margin-bottom: 20px; }
        .busca-container { margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; background-color: #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0056b3; color: #fff; }
        tr:hover { background-color: #f1f6fc; }
        .status { margin-bottom: 15px; font-weight: bold; color: #d9534f; padding: 10px; border-radius: 5px; background-color: #fdf2f2; border: 1px solid #d9534f; display: inline-block;}
    </style>
</head>
<body>

    <h1>Mapeamento Escolar: 100% Automatizado</h1>
    <p>Os dados abaixo são atualizados diariamente através do nosso robô de varredura web (Web Scraper).</p>
    
    <div class="status" id="statusMsg">Buscando os dados mais recentes do robô...</div>

    <div class="busca-container">
        <input type="text" id="searchInput" onkeyup="filtrarTabela()" placeholder="Busque por escola, curso ou cidade...">
    </div>

    <table id="tabelaEscolas">
        <thead>
            <tr>
                <th>Escola</th>
                <th>Tipo</th>
                <th>Cidade</th>
                <th>Cursos / Disciplinas</th>
                <th>Endereço</th>
                <th>Contato</th>
                <th>Responsável</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dados injetados pelo Fetch -->
        </tbody>
    </table>

    <script>
        // AGORA O SITE LÊ DIRETAMENTE O ARQUIVO GERADO PELO SEU ROBÔ NO GITHUB
        const urlArquivoCSV = "novas_escolas_encontradas.csv";

        async function carregarDados() {
            try {
                // Tenta buscar o arquivo CSV local
                const resposta = await fetch(urlArquivoCSV);
                
                // Verifica se o arquivo existe (se o robô rodou com sucesso)
                if (!resposta.ok) {
                    throw new Error("O arquivo CSV ainda não existe.");
                }

                const csvTexto = await resposta.text();

                // PapaParse transforma o texto CSV em um Array do JavaScript
                Papa.parse(csvTexto, {
                    header: true, // Avisa que a primeira linha é o cabeçalho
                    skipEmptyLines: true,
                    complete: function(resultados) {
                        montarTabela(resultados.data);
                        // Esconde a mensagem de status se deu tudo certo
                        document.getElementById("statusMsg").style.display = "none";
                    }
                });
            } catch (erro) {
                // Se der erro, avisa que está esperando o robô trabalhar
                document.getElementById("statusMsg").innerText = "Aguardando o robô concluir a varredura para exibir os dados. (Arquivo CSV não encontrado).";
                console.error(erro);
            }
        }

        function montarTabela(dados) {
            const tbody = document.querySelector("#tabelaEscolas tbody");
            tbody.innerHTML = "";
            
            dados.forEach(escola => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${escola["Escola"] || '-'}</strong></td>
                    <td>${escola["Tipo"] || '-'}</td>
                    <td>${escola["Cidade"] || '-'}</td>
                    <td>${escola["Cursos"] || escola["Cursos / Disciplinas"] || '-'}</td>
                    <td>${escola["Endereço"] || '-'}</td>
                    <td>${escola["Contato"] || '-'}</td>
                    <td>${escola["Responsável"] || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabela() {
            const input = document.getElementById("searchInput").value.toUpperCase();
            const trs = document.querySelectorAll("#tabelaEscolas tbody tr");
            trs.forEach(tr => {
                tr.style.display = tr.innerText.toUpperCase().includes(input) ? "" : "none";
            });
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
